[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-analysis"
version = "0.1.0"
description = "UAV video analysis pipeline"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core", "core.*", "pipeline", "pipeline.*", "detection", "detection.*", "configs", "configs.*", "tracking", "tracking.*", "grouping", "grouping.*"]
namespaces = false
