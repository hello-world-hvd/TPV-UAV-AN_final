[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-analysis"
version = "0.1.0"
description = "UAV video analysis pipeline"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["core", "core.*", "detection", "detection.*", "tracking", "tracking.*", "grouping", "grouping.*", "behavior", "behavior.*", "alerts", "alerts.*"]
namespaces = false
