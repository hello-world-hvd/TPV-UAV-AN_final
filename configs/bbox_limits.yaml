# Giới hạn bbox từng object, tự đọc cùng thư mục detection YAML; không giới hạn bbox nhóm.
# Tỷ lệ so với chiều rộng/cao/diện tích frame gốc, không phụ thuộc độ phân giải.
# Đây là ngưỡng khởi đầu cho video UAV: object thật ở gần camera có thể cần nới.
# max_width_ratio: chiều rộng box / chiều rộng ảnh tối đa.
# max_height_ratio: chiều cao box / chiều cao ảnh tối đa.
# max_area_ratio: diện tích box / diện tích ảnh tối đa.
# Xóa mục nhãn hoặc đặt cả ba bằng 1 để không giới hạn kích thước nhãn đó.
người:
  max_width_ratio: 0.4
  max_height_ratio: 0.65
  max_area_ratio: 0.12
xe máy:
  max_width_ratio: 0.5
  max_height_ratio: 0.65
  max_area_ratio: 0.18
