task: obb  # Nhánh ver3OBB dùng model box xoay.
# Thiết lập model, tham số suy luận và ngưỡng nhận diện của hệ thống.
# Đường dẫn tương đối được tính từ thư mục chứa file này.
models:                                 # Danh sách model chạy trên cùng ảnh; đường dẫn tương đối tính từ file YAML.
  - ../models/yolo26m_obb.engine

runtime:                                # Số luồng tính CPU, áp dụng trước khi nạp model/khởi động worker.
  cv_threads: 4                         # OpenCV: resize, optical flow và các phép hỗ trợ đa luồng.
  torch_threads: 2                      # PyTorch CPU intra-op; không phải số luồng GPU hay FFmpeg.

inference:                              # Tham số suy luận áp dụng cho các model.
  parallel_models: false                 # true: hai engine TensorRT 10+ kích thước cố định chạy trên CUDA stream riêng; false: tuần tự.
  device: "0"                           # Thiết bị: cpu, mps (GPU Apple), hoặc "0" (GPU CUDA đầu tiên).
  imgsz: 960                            # Kích thước ảnh suy luận theo pixel, bội số 32; engine cố định cần export lại khi đổi.
  confidence: 0.35                      # Ngưỡng mặc định cho nhãn không có trong thresholds; model lấy ngưỡng nhỏ nhất trước khi lọc từng nhãn.
  nms_iou: 0.5                          # Ngưỡng IoU truyền vào hậu xử lý từng model; không loại chéo lớp. Engine end-to-end có thể xử lý khác.
  merge_iou: 0.5                        # Loại box cùng nhãn nếu IoU > ngưỡng này sau khi gom kết quả model; giữ confidence cao hơn.
  merge_ios: 0.9                        # Loại box cùng nhãn nếu giao/diện tích box nhỏ >= ngưỡng; null để tắt; giữ confidence cao hơn.
  max_detections: 300                   # Số detection tối đa mỗi model mỗi ảnh; engine end-to-end còn bị giới hạn khi export.
  detect_fps: null                         # Số lượt detect mỗi giây video nguồn; null: mọi frame. Không phải FPS xử lý hay FPS output.

# Ngưỡng riêng cho 13 nhãn; bỏ lớp Xe bán hàng rong ngoài danh sách.
thresholds:                             # Ngưỡng confidence riêng từng nhãn, thuộc (0, 1]; tăng để lọc mạnh hơn, có thể bỏ sót.
  Người: 0.4                            # Confidence tối thiểu của nhãn này.
  Xe máy: 0.35                          # Confidence tối thiểu của nhãn này.
  Bàn: 0.35                        # Confidence tối thiểu của nhãn này.
  Ghế: 0.35                        # Confidence tối thiểu của nhãn này.
  Xe đẩy bán hàng: 0.3                  # Confidence tối thiểu của nhãn này.
  Biển quảng cáo: 0.45                  # Confidence tối thiểu của nhãn này.
  Cột điện: 0.35                        # Confidence tối thiểu của nhãn này.
  Thân cây: 0.35                        # Confidence tối thiểu của nhãn này.
  Hàng hóa bày bán: 0.45                        # Confidence tối thiểu của nhãn này.
  Vật liệu xây dựng: 0.35               # Confidence tối thiểu của nhãn này.
  Máy móc: 0.35                 # Ngưỡng confidence của máy móc.
  Xô: 0.35                         # Confidence tối thiểu của nhãn này.
  Phương tiện thu gom, vận chuyển rác: 0.35                      # Confidence tối thiểu của nhãn này.

output:                                 # Thiết lập kết quả xuất ra.
  directory: ../outputs/detect          # Thư mục gốc lưu kết quả; --output trên dòng lệnh có thể ghi đè.
  font: null                            # Đường dẫn font Unicode .ttf; null: tự tìm font tiếng Việt trên máy.

  video:                                # Cấu hình ghi video; nếu bỏ phần này mặc định OpenCV, ghi đồng bộ.
    encoder: nvenc                      # nvenc: FFmpeg H.264 trên NVIDIA; opencv: VideoWriter mp4v.
    preset: p1                          # NVENC p1..p7: p1 ưu tiên tốc độ, p7 ưu tiên hiệu quả nén/chất lượng.
    cq: 20                              # Mức chất lượng NVENC 0..51; giảm thường tăng chất lượng và dung lượng.
    async_encode: true                  # true: worker ghi riêng; false: ghi trực tiếp trong vòng xử lý.
    queue_size: 2                       # Số frame tối đa chờ trong worker (1..8); đầy thì chờ, không bỏ frame; chỉ dùng khi async.
    ffmpeg: ../.tools/nvenc/bin/ffmpeg  # Executable FFmpeg có NVENC tương thích driver; đường dẫn tương đối tính từ YAML.
